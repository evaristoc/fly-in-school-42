<!DOCTYPE html>
<html>

<head>
    <title>MAPF Map Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }

            margin: 5px;

<script src="../js/editor.js"></script>

</html>
